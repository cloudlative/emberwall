name: Deploy to GitHub Pages

# Publishes the website (site/, built into dist-site/) with the web app at /app/.
# Needs Pages enabled once: repository Settings -> Pages -> Source: "GitHub Actions".
# For a custom domain, set the repository variable SITE_URL (e.g. https://emberwall.example.com/).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run site:build
        env:
          EMBERWALL_SITE_URL: ${{ vars.SITE_URL || 'https://cloudlative.github.io/emberwall/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deployment
        uses: actions/deploy-pages@v4
